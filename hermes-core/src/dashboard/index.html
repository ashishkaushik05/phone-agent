<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hermes-core</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234aa3ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/dashboard/style.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- ============ TOKEN GATE ============ -->
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h1>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Connect to hermes-core
      </h1>
      <p>Enter the control token (<code>PHONE_AGENT_CONTROL_TOKEN</code>) to view live calls and manage personas, contacts and devices.</p>
      <form id="gate-form">
        <input class="in" id="gate-token" type="password" placeholder="Control token" autocomplete="off" />
        <div class="gate-error" id="gate-error"></div>
        <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;margin-top:8px">Connect</button>
      </form>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div class="shell" id="shell" hidden>

    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>hermes</span>
      </div>

      <div class="conn-pill">
        <span class="dot" id="conn-dot"></span>
        <span id="conn-label">connecting…</span>
      </div>

      <div class="devices-row" id="device-chips"></div>
      <button class="token-btn" id="btn-forget-token" type="button" title="Forget the stored token">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        Session
      </button>
    </div>

    <div class="conn-banner" id="conn-banner" hidden></div>

    <div class="body">
      <div class="sidebar">
        <button type="button" class="nav-item" data-tab="calls">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l1.5 4.5-2 1.5c1 2.5 3 4.5 5.5 5.5l1.5-2L20 14v3a2 2 0 0 1-2 2C10.5 19 5 13.5 5 6a2 2 0 0 1 1-2z"/></svg>
          Calls
          <span class="nav-count" id="nav-count-calls"></span>
        </button>
        <button type="button" class="nav-item" data-tab="personas">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
          Personas
        </button>
        <button type="button" class="nav-item" data-tab="contacts">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5.2 5.5-5.2s5.5 2.2 5.5 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.6 13.3c2.5.4 4.4 2.3 4.4 5.2"/></svg>
          Contacts
        </button>
        <button type="button" class="nav-item" data-tab="sms">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="2.5"/><path d="M8 16.5 5.3 19.5v-3.4"/></svg>
          SMS
        </button>
        <button type="button" class="nav-item" data-tab="whatsapp">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3.5-6.6"/><path d="M12 4a8 8 0 0 1 8 8"/><path d="M8.5 9.5c.3 2.5 2.5 4.7 5 5l1-1.3c.2-.3.6-.4 1-.3l2 .7c.4.1.6.6.4 1-.6 1.3-2 2-3.4 1.7-3.6-.7-6.4-3.5-7.1-7.1-.3-1.4.4-2.8 1.7-3.4.4-.2.9 0 1 .4l.7 2c.1.4 0 .8-.3 1z"/></svg>
          WhatsApp
          <span class="nav-count" id="nav-count-whatsapp"></span>
        </button>
        <button type="button" class="nav-item" data-tab="devices">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><line x1="10" y1="18.5" x2="14" y2="18.5"/></svg>
          Devices
          <span class="nav-count" id="nav-count-devices"></span>
        </button>
        <div class="sidebar-foot" id="sidebar-foot">hermes-core</div>
      </div>

      <div class="content" id="content">
        <!-- filled per-tab by app.js -->
      </div>
    </div>
  </div>

  <script src="/dashboard/app.js"></script>
</body>
</html>
